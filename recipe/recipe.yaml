schema_version: 1

context:
  name: azure-mgmt-sqlvirtualmachine
  version: "1.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: a1830b37467de86e7bdf739ea8550f5d2030ebd47e3b408d621a2397cc74d915

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - setuptools
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - isodate >=0.6.1
    - azure-mgmt-core >=1.6.0
    - typing-extensions >=4.6.0

tests:
  - python:
      imports:
        - azure.mgmt.sqlvirtualmachine
        - azure.mgmt.sqlvirtualmachine.models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Microsoft Azure SQL Virtual Machine Management Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python

extra:
  recipe-maintainers:
    - janjagusch
